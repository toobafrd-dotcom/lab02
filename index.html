
<!DOCTYPE html>
<html>
<head>
  <title>Welcome Website</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
    }

    .welcome {
      color: white;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 50px;
    }

    p {
      font-size: 22px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="welcome">
    <h1>Welcome!</h1>
    <p>My name is <strong>Your Name</strong> 👋</p>
  </div>

</body>
</html>
